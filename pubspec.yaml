name: libora
description: "Libora - A personal digital reading ecosystem. Discover, read, interact, save, and remember books."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # File & Storage
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Reading & Documents
  # EPUB reading via epubx + html parsing
  epubx: ^4.0.0
  html: ^0.15.4
  # PDF viewing
  syncfusion_flutter_pdfviewer: ^34.2.6

  # Networking - for browsing/discovering books
  http: ^1.2.2
  dio: ^5.7.0

  # UI & Utils
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  path_provider_android: ^2.2.10
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.2
  device_info_plus: ^10.1.2
  archive: ^3.6.1
  uuid: ^4.5.1
  collection: ^1.18.0
  url_launcher_android: ^6.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
